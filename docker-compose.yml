services:
  api:
    build:
      context: ./api/SSA.SDS.Api
      dockerfile: Dockerfile
    ports:
      - "5007:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Server=host.docker.internal;Database=sds_db;Integrated Security=true;Trust Server Certificate=true
      - Jwt__SecretKey=SSA-SDS-SecretKey-2024-MustBeAtLeast32CharsLong!
      - Jwt__Issuer=SSA-SDS
      - Jwt__Audience=SSA-SDS-Client
      - LLM__BaseUrl=http://llm-service:8000
      - LLM__TimeoutSeconds=300
      - FileStorage__UploadPath=/app/uploads
      - FileStorage__MaxFileSizeMB=20
    volumes:
      - sds-uploads:/app/uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend/sds-frontend
      dockerfile: Dockerfile
    ports:
      - "4200:80"
    depends_on:
      - api
    restart: unless-stopped

  llm-service:
    # Servizio C# .NET 8 (SSA.LlmService) che fa da proxy al server LLM (llama.cpp)
    build:
      context: ./llm-service
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      # URL del server llama.cpp (es. http://qwen-server:8080)
      - LLM__BaseUrl=http://host.docker.internal:8080
      - LLM__Model=local-model
      - LLM__TimeoutSeconds=300
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  sds-uploads:
