services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sds_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./api/SSA.SDS.Api
      dockerfile: Dockerfile
    ports:
      - "5000:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=sds_db;Username=postgres;Password=postgres
      - Jwt__SecretKey=SSA-SDS-SecretKey-2024-MustBeAtLeast32CharsLong!
      - Jwt__Issuer=SSA-SDS
      - Jwt__Audience=SSA-SDS-Client
      - LLM__BaseUrl=http://llm-service:8000/api
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend/sds-frontend
      dockerfile: Dockerfile
    ports:
      - "4200:80"
    depends_on:
      - api
    restart: unless-stopped

  llm-service:
    build:
      context: ./llm-service
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - LLM_BASE_URL=http://qwen-server:8080/v1
      - EMBEDDING_URL=http://bge-embed:8081/embed
      - RERANKING_URL=http://bge-rerank:8082/rerank
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  postgres_data:
