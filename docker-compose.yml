services:
  api:
    build:
      context: ./api/SSA.SDS.Api
      dockerfile: Dockerfile
    ports:
      - "5000:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Server=host.docker.internal;Database=sds_db;Integrated Security=true;Trust Server Certificate=true
      - Jwt__SecretKey=SSA-SDS-SecretKey-2024-MustBeAtLeast32CharsLong!
      - Jwt__Issuer=SSA-SDS
      - Jwt__Audience=SSA-SDS-Client
      - LLM__BaseUrl=http://llm-service:8000/api
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend/sds-frontend
      dockerfile: Dockerfile
    ports:
      - "4200:80"
    depends_on:
      - api
    restart: unless-stopped

  llm-service:
    build:
      context: ./llm-service
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - LLM_BASE_URL=http://qwen-server:8080/v1
      - EMBEDDING_URL=http://bge-embed:8081/embed
      - RERANKING_URL=http://bge-rerank:8082/rerank
    restart: unless-stopped
